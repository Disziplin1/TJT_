<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>저널DIA단면거리(연삭거리) 측정기</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    body {
      margin: 0;
      background-color: #f5f5f5;
      font-family: sans-serif;
      text-align: center;
    }
    model-viewer {
      width: 100vw;
      height: 80vh;
      display: block;
      margin: 0 auto;
    }
    .controls {
      margin-top: 10px;
    }
    input[type="range"] {
      width: 60%;
    }
    .timecode {
      margin-top: 5px;
      font-size: 14px;
      color: #333;
    }
  </style>
</head>
<body>
  <model-viewer
    id="viewer"
    src="https://disziplin1.github.io/TJT_/TRUNNION/Journal_DIA/Journal_DIA.glb"
    camera-controls
    autoplay
    shadow-intensity="0.8"
    exposure="0.9"
    environment-image="neutral"
    interaction-prompt="none">
  </model-viewer>

  <div class="controls">
    <button id="toggleBtn">⏸ 정지</button>
    <br /><br />
    <input type="range" id="seekBar" min="0" max="1" step="0.001" value="0">
    <div class="timecode" id="timeDisplay">00:00 / 00:00</div>
  </div>

  <script>
    const viewer = document.getElementById('viewer');
    const seekBar = document.getElementById('seekBar');
    const timeDisplay = document.getElementById('timeDisplay');
    const toggleBtn = document.getElementById('toggleBtn');
    let animationFrameId;
    let isPlaying = true;

    function formatTime(seconds) {
      const min = Math.floor(seconds / 60);
      const sec = Math.floor(seconds % 60);
      return `${String(min).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
    }

    function updateSeekBar() {
      if (viewer.duration) {
        const progress = viewer.currentTime / viewer.duration;
        seekBar.value = progress;
        timeDisplay.textContent = `${formatTime(viewer.currentTime)} / ${formatTime(viewer.duration)}`;
      }
      animationFrameId = requestAnimationFrame(updateSeekBar);
    }

    seekBar.addEventListener('input', () => {
      viewer.currentTime = seekBar.value * viewer.duration;
    });

    toggleBtn.addEventListener('click', () => {
      if (isPlaying) {
        viewer.pause();
        toggleBtn.textContent = '▶ 재생';
        cancelAnimationFrame(animationFrameId);
      } else {
        viewer.play();
        toggleBtn.textContent = '⏸ 정지';
        cancelAnimationFrame(animationFrameId);
        updateSeekBar();
      }
      isPlaying = !isPlaying;
    });

    window.addEventListener('DOMContentLoaded', () => {
      updateSeekBar();
    });
  </script>
</body>
</html>
