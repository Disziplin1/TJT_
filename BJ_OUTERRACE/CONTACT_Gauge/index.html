<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>센터 깊이(확인) 측정기</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden; /* 스크롤 방지 */
      background-color: #f5f5f5;
      font-family: sans-serif;
    }

    .viewer-wrapper {
      width: 100vw;
      height: 100dvh; /* 진짜 화면 높이 */
      position: relative;
    }

    model-viewer {
      width: 100%;
      height: 100%;
      display: block;
    }

    .controls {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      background-color: rgba(255, 255, 255, 0.7);
      padding: 8px;
      border-radius: 10px;
      text-align: center;
      z-index: 10;

      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }
    .controls.show { opacity: 1; pointer-events: auto; }

    .controls button {
      font-size: 1em;
      padding: 0.4em 1em;
      margin-bottom: 6px;
    }

    .controls input[type="range"] {
      width: 100%;
    }

    .timecode {
      font-size: 0.9em;
      color: #333;
      margin-top: 4px;
    }
  
      /* ── 컨트롤 토글 버튼 (항상 표시) ── */
      .ctrl-toggle {
        position: fixed;
        bottom: 1rem;
        right: 1rem;
        z-index: 30;
        width: 48px; height: 48px;
        border-radius: 14px;
        border: none;
        background: rgba(0,0,0,.55);
        color: #fff;
        font-size: 1.3rem;
        cursor: pointer;
        display: flex; align-items: center; justify-content: center;
        backdrop-filter: blur(4px);
        transition: background .2s;
      }
      .ctrl-toggle.active { background: rgba(182,95,207,.85); }
    </style>
</head>
<body>
  <div class="viewer-wrapper">
    <model-viewer
      id="viewer"
      src="https://disziplin1.github.io/TJT_/BJ_OUTERRACE/CONTACT_Gauge/CONTACT_Gauge.glb"
      camera-controls
      autoplay
      shadow-intensity="0.8"
      exposure="0.9"
      environment-image="neutral"
      interaction-prompt="none">
    </model-viewer>

    <button id="ctrlToggle" class="ctrl-toggle" title="컨트롤 표시/숨기기">⏵</button>


    <div class="controls">
      <button id="toggleBtn">❚❚ 정지</button>
      <input type="range" id="seekBar" min="0" max="1" step="0.001" value="0">
      <div class="timecode" id="timeDisplay">00:00 / 00:00</div>
    </div>
  </div>

  <script>
    const viewer = document.getElementById('viewer');
    const seekBar = document.getElementById('seekBar');
    const timeDisplay = document.getElementById('timeDisplay');
    const toggleBtn = document.getElementById('toggleBtn');
    let animationFrameId;
    let isPlaying = true;

    function formatTime(seconds) {
      const min = Math.floor(seconds / 60);
      const sec = Math.floor(seconds % 60);
      return `${String(min).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
    }

    function updateSeekBar() {
      if (viewer.duration) {
        const progress = viewer.currentTime / viewer.duration;
        seekBar.value = progress;
        timeDisplay.textContent = `${formatTime(viewer.currentTime)} / ${formatTime(viewer.duration)}`;
      }
      animationFrameId = requestAnimationFrame(updateSeekBar);
    }

    seekBar.addEventListener('input', () => {
      viewer.currentTime = seekBar.value * viewer.duration;
    });

    toggleBtn.addEventListener('click', () => {
      if (isPlaying) {
        viewer.pause();
        toggleBtn.textContent = '▶ 재생';
        cancelAnimationFrame(animationFrameId);
      } else {
        viewer.play();
        toggleBtn.textContent = '❚❚ 정지';
        updateSeekBar();
      }
      isPlaying = !isPlaying;
    });

    window.addEventListener('DOMContentLoaded', () => {
      updateSeekBar();
    });

      /* ── 컨트롤 토글 ── */
      const ctrlToggle = document.getElementById('ctrlToggle');
      const controlsEl = document.querySelector('.controls');
      function setControls(show) {
        controlsEl.classList.toggle('show', show);
        ctrlToggle.classList.toggle('active', show);
        ctrlToggle.textContent = show ? '✕' : '⏵';
      }
      ctrlToggle.addEventListener('click', () => setControls(!controlsEl.classList.contains('show')));
      if (window.matchMedia('(hover: none) and (pointer: coarse)').matches) setControls(true);

  </script>
</body>
</html>
