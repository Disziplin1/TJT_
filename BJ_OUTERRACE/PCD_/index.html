<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>PCD 측정기</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    body {
      margin: 0;
      background-color: #000;
    }
    model-viewer {
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>
  <model-viewer
    src="PCD_.glb"
    ar
    ar-modes="webxr scene-viewer"
    auto-rotate
    camera-controls
    autoplay
    shadow-intensity="0.8"
    exposure="0.6"
    environment-image="studio">
  </model-viewer>
</body>
</html>
