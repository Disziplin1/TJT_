<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>코킹검사게이지</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    html, body { margin:0; height:100%; background:#f5f5f5; }
    model-viewer { width:100%; height:100dvh; display:block; }

    .floating-btn{
      position:fixed; right:1rem; bottom:1rem;
      padding:.6rem .9rem; border:0; border-radius:.6rem;
      background:rgba(0,0,0,.6); color:#fff; cursor:pointer;
    }
    /* hover + 키보드 포커스 표시 한 번에 */
    .floating-btn:is(:hover, :focus-visible){
      outline:3px solid #B65FCF;
    }
  </style>
</head>
<body>
  <model-viewer
    id="viewer"
    src="https://disziplin1.github.io/TJT_/BJ_OUTERRACE/Caulking_/Caulking_.glb"
    camera-controls
    autoplay
    auto-rotate
    rotation-per-second="-15deg"
    auto-rotate-delay="0"
    shadow-intensity="0.8"
    exposure="0.9"
    environment-image="neutral"
    interaction-prompt="none">
  </model-viewer>

  <button id="toggleRotate" class="floating-btn" aria-pressed="true">자동회전 끄기</button>

  <script>
    const viewer = document.getElementById('viewer');
    const btn = document.getElementById('toggleRotate');

    // 사용자 OS의 '움직임 줄이기' 설정을 존중
    const prefersReduced = matchMedia('(prefers-reduced-motion: reduce)');
    if (prefersReduced.matches) viewer.autoRotate = false;
    prefersReduced.addEventListener?.('change', e => {
      viewer.autoRotate = !e.matches;
      syncLabel();
    });

    function syncLabel(){
      const on = viewer.autoRotate === true;
      btn.textContent = on ? '자동회전 끄기' : '자동회전 켜기';
      btn.setAttribute('aria-pressed', String(on));
    }

    btn.addEventListener('click', () => {
      viewer.autoRotate = !viewer.autoRotate;
      syncLabel();
    });

    // 초기 라벨 동기화
    syncLabel();
  </script>
</body>
</html>
