<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>소재내경기준 외경동심도 측정기</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #f5f5f5;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
    }

    model-viewer {
      width: 100%;
      height: calc(100vh - 140px);
      flex-shrink: 0;
    }

    .controls {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
      padding: 10px 20px;
      background-color: #f5f5f5;
      box-sizing: border-box;
      text-align: center;
    }

    button {
      font-size: 1.2em;
      padding: 0.4em 1em;
    }

    input[type="range"] {
      width: 100%;
      height: 1.2em;
      margin-top: 10px;
    }

    .timecode {
      margin-top: 5px;
      font-size: 1em;
      color: #333;
    }

    @media (max-width: 480px) {
      button {
        font-size: 1em;
        padding: 0.3em 0.8em;
      }
      .timecode {
        font-size: 0.9em;
      }
    }
  </style>
</head>
<body>
  <model-viewer
    id="viewer"
    src="https://disziplin1.github.io/TJT_/TJ_OUTERRACE/ID_Based/ID_Based.glb"
    camera-controls
    autoplay
    shadow-intensity="0.8"
    exposure="0.9"
    environment-image="neutral"
    interaction-prompt="none">
  </model-viewer>

  <div class="controls">
    <button id="toggleBtn">❚❚ 정지</button>
    <input type="range" id="seekBar" min="0" max="1" step="0.001" value="0">
    <div class="timecode" id="timeDisplay">00:00 / 00:00</div>
  </div>

  <script>
    const viewer = document.getElementById('viewer');
    const seekBar = document.getElementById('seekBar');
    const timeDisplay = document.getElementById('timeDisplay');
    const toggleBtn = document.getElementById('toggleBtn');
    let animationFrameId;
    let isPlaying = true;

    function formatTime(seconds) {
      const min = Math.floor(seconds / 60);
      const sec = Math.floor(seconds % 60);
      return `${String(min).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
    }

    function updateSeekBar() {
      if (viewer.duration) {
        const progress = viewer.currentTime / viewer.duration;
        seekBar.value = progress;
        timeDisplay.textContent = `${formatTime(viewer.currentTime)} / ${formatTime(viewer.duration)}`;
      }
      animationFrameId = requestAnimationFrame(updateSeekBar);
    }

    seekBar.addEventListener('input', () => {
      viewer.currentTime = seekBar.value * viewer.duration;
    });

    toggleBtn.addEventListener('click', () => {
      if (isPlaying) {
        viewer.pause();
        toggleBtn.textContent = '▶ 재생';
        cancelAnimationFrame(animationFrameId);
      } else {
        viewer.play();
        toggleBtn.textContent = '❚❚ 정지';
        updateSeekBar();
      }
      isPlaying = !isPlaying;
    });

    window.addEventListener('DOMContentLoaded', () => {
      updateSeekBar();
    });
  </script>
</body>
</html>
