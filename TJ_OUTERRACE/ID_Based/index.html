<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>소재내경기준 외경동심도 측정기</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background-color: #f5f5f5;
      font-family: sans-serif;
    }

    .viewer-wrapper {
      position: relative;
      width: 100%;
      max-width: 600px;
      height: 80vh; /* 화면 높이의 80% */
      margin: 0 auto;
      background-color: #fff;
    }

    model-viewer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    .controls {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      background-color: rgba(255, 255, 255, 0.7); /* 반투명 배경 */
      padding: 8px;
      border-radius: 10px;
      z-index: 2;
      text-align: center;
    }

    .controls button {
      font-size: 1em;
      padding: 0.4em 1em;
      margin-bottom: 6px;
    }

    .controls input[type="range"] {
      width: 100%;
    }

    .timecode {
      font-size: 0.9em;
      color: #333;
      margin-top: 4px;
    }

    @media (max-width: 480px) {
      .controls button {
        font-size: 0.9em;
        padding: 0.3em 0.8em;
      }

      .timecode {
        font-size: 0.8em;
      }
    }
  </style>
</head>
<body>

  <div class="viewer-wrapper">
    <model-viewer
      id="viewer"
      src="https://disziplin1.github.io/TJT_/TJ_OUTERRACE/ID_Based/ID_Based.glb"
      camera-controls
      autoplay
      shadow-intensity="0.8"
      exposure="0.9"
      environment-image="neutral"
      interaction-prompt="none">
    </model-viewer>

    <div class="controls">
      <button id="toggleBtn">❚❚ 정지</button>
      <input type="range" id="seekBar" min="0" max="1" step="0.001" value="0">
      <div class="timecode" id="timeDisplay">00:00 / 00:00</div>
    </div>
  </div>

  <script>
    const viewer = document.getElementById('viewer');
    const seekBar = document.getElementById('seekBar');
    const timeDisplay = document.getElementById('timeDisplay');
    const toggleBtn = document.getElementById('toggleBtn');
    let animationFrameId;
    let isPlaying = true;

    function formatTime(seconds) {
      const min = Math.floor(seconds / 60);
      const sec = Math.floor(seconds % 60);
      return `${String(min).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
    }

    function updateSeekBar() {
      if (viewer.duration) {
        const progress = viewer.currentTime / viewer.duration;
        seekBar.value = progress;
        timeDisplay.textContent = `${formatTime(viewer.currentTime)} / ${formatTime(viewer.duration)}`;
      }
      animationFrameId = requestAnimationFrame(updateSeekBar);
    }

    seekBar.addEventListener('input', () => {
      viewer.currentTime = seekBar.value * viewer.duration;
    });

    toggleBtn.addEventListener('click', () => {
      if (isPlaying) {
        viewer.pause();
        toggleBtn.textContent = '▶ 재생';
        cancelAnimationFrame(animationFrameId);
      } else {
        viewer.play();
        toggleBtn.textContent = '❚❚ 정지';
        updateSeekBar();
      }
      isPlaying = !isPlaying;
    });

    window.addEventListener('DOMContentLoaded', () => {
      updateSeekBar();
    });
  </script>
</body>
</html>
