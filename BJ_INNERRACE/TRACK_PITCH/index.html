<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>TRACK PITCH & 외경중심도 측정기</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    body {
      margin: 0;
      background-color: #000;
    }
    model-viewer {
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>

  <model-viewer
    id="viewer"
    src="TRACK_PITCH.glb"
    ar
    ar-modes="webxr scene-viewer"
    auto-rotate
    camera-controls
    autoplay
    shadow-intensity="0.8"
    exposure="0.6"
    environment-image="neutral">
  </model-viewer>

  <script>
    const viewer = document.getElementById("viewer");

    let animationPlaying = false;   // 현재 애니메이션이 실행 중인지 여부
    let allowUserPlay = false;      // 사용자가 클릭해서 재생할 수 있는 상태인지 여부

    // 페이지 로드되면 자동 1회 재생 시작
    viewer.addEventListener('load', () => {
      viewer.play();
      animationPlaying = true;
    });

    // 자동 재생이 끝나면 멈추고 다시 못 돌게 설정
    viewer.addEventListener('animation-finished', () => {
      viewer.pause();
      animationPlaying = false;
      allowUserPlay = true;
    });

    // 클릭 시 재생 (단, 이미 재생 중이거나 아직 허용 전이면 무시)
    viewer.addEventListener('click', () => {
      if (!animationPlaying && allowUserPlay) {
        viewer.play();
        animationPlaying = true;
      }
    });
  </script>

</body>
</html>
