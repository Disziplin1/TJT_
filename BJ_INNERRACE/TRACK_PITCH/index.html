<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>TRACK PITCH & 외경중심도 측정기</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    body {
      margin: 0;
      background-color: #000;
    }
    model-viewer {
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>

  <model-viewer
    id="viewer"
    src="TRACK_PITCH.glb"
    ar
    ar-modes="webxr scene-viewer"
    auto-rotate
    camera-controls
    autoplay
    shadow-intensity="0.8"
    exposure="0.6"
    environment-image="neutral">
  </model-viewer>

  <script>
    const viewer = document.getElementById("viewer");
    let hasPlayedOnce = false;

    // 애니메이션 1회 끝나면 멈추기 (loop 방지)
    viewer.addEventListener('animation-finished', () => {
      hasPlayedOnce = true;
      viewer.pause();
    });

    // 그 이후 터치하면 수동 재생
    viewer.addEventListener('click', () => {
      if (hasPlayedOnce) {
        viewer.play();
      }
    });
  </script>

</body>
</html>
