<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>장착거리 검사 GAUGE</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    body {
      margin: 0;
      background-color: #000;
    }
    model-viewer {
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>
  <model-viewer
    id="viewer"
    src="Mounting_Distance.glb"
    ar
    ar-modes="webxr scene-viewer quick-look"
    camera-controls
    auto-rotate
    shadow-intensity="0.8"
    exposure="0.6"
    environment-image="neutral"
  >
  </model-viewer>

  <script>
    const viewer = document.getElementById('viewer');

    const firstAnimation = 'Action 1';
    const secondAnimation = 'Action 2';

    viewer.addEventListener('load', () => {
      viewer.animationName = firstAnimation;
      viewer.play();
    });

    viewer.addEventListener('finished', () => {
      if (viewer.animationName === firstAnimation) {
        viewer.animationName = secondAnimation;
        viewer.play();
      }
    });
  </script>
</body>
</html>
