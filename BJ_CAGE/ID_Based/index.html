<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>내경기준외경동심도 측정기</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    body {
      margin: 0;
      background-color: #dcdcdc;
    }
    model-viewer {
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>
  <model-viewer
  src="ID_Based.glb"
  ar
  ar-modes="webxr scene-viewer quick-look"
  auto-rotate
  camera-controls
  autoplay
  shadow-intensity="0.8"
  exposure="0.8"
  environment-image="neutral"
>
</model-viewer>
</html>
