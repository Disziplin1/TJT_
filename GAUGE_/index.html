<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>게이지 (GAUGE)</title>
    <script
      type="module"
      src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"
    ></script>
    <style>
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #f5f5f5;
        font-family: sans-serif;
      }

      .viewer-wrapper {
        width: 100vw;
        height: 100vh;
        position: relative;
      }

      model-viewer {
        width: 100%;
        height: 100%;
        display: block;
      }

      #modelName {
        position: absolute;
        top: 50px;
        left: 50px;
        z-index: 20;
        font-size: 3rem;
        font-weight: bold;
        padding: 10px 20px;
        background-color: rgba(50, 50, 50, 0.5);
        color: white;
        border-radius: 8px;
      }

      .logo {
        position: absolute;
        top: 40px;
        right: 50px;
        z-index: 20;
        width: 200px;
        height: auto;
      }

      /* ── 컨트롤 토글 버튼 ── */
      .ctrl-toggle {
        position: absolute;
        bottom: 1rem;
        right: 1rem;
        z-index: 30;
        width: 48px; height: 48px;
        border-radius: 14px;
        border: none;
        background: rgba(0,0,0,.55);
        color: #fff;
        font-size: 1.3rem;
        cursor: pointer;
        display: flex; align-items: center; justify-content: center;
        backdrop-filter: blur(4px);
        transition: background .2s;
      }
      .ctrl-toggle.active { background: rgba(182,95,207,.85); }

      .controls {
        position: absolute;
        bottom: 12px;
        left: 50%;
        transform: translateX(-50%);
        width: 90%;
        background-color: rgba(255, 255, 255, 0.7);
        padding: 8px;
        border-radius: 10px;
        text-align: center;
        z-index: 10;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s;
      }
      .controls.show { opacity: 1; pointer-events: auto; }

      .button-row {
        display: flex;
        justify-content: center;
        gap: 12px;
        margin-bottom: 6px;
      }

      .controls button {
        font-size: 1em;
        padding: 0.4em 1em;
        border: none;
        border-radius: 6px;
        background-color: #f5f5f5;
        cursor: pointer;
      }

      .progress-bar-wrap {
        width: 100%;
        height: 6px;
        background: #ddd;
        border-radius: 3px;
        overflow: hidden;
        margin: 6px 0 4px;
      }
      .progress-bar {
        height: 100%;
        background: #b65fcf;
        border-radius: 3px;
        width: 0%;
        transition: width 0.1s linear;
      }

      .timecode { font-size: 0.9em; color: #333; margin-top: 2px; }
    
      /* ── PC: hover 표시 / 터치: 항상 표시 ── */
      @media (hover: hover) and (pointer: fine) {
        .ctrl-toggle { display: none; }
        .viewer-wrapper:hover .controls  { opacity: 1; pointer-events: auto; }
        .viewer-wrapper:hover .zoom-slider { opacity: 1; pointer-events: auto; }
      }
      @media (hover: none) and (pointer: coarse) {
        .ctrl-toggle { display: none; }
        .controls    { opacity: 1 !important; pointer-events: auto !important; }
        .zoom-slider { opacity: 1 !important; pointer-events: auto !important; }
      }
    </style>
  </head>

  <body>
    <div class="viewer-wrapper">
      <model-viewer
        id="viewer"
        src=""
        camera-controls
        auto-rotate
        rotation-per-second="-15deg"
        auto-rotate-delay="0"
        shadow-intensity="0.8"
        exposure="0.9"
        environment-image="neutral"
        interaction-prompt="none"
      >
      </model-viewer>

      <div id="modelName">제품명</div>
      <img
        src="https://tjteng.co.kr/images/tjteng.png"
        alt="TJT 로고"
        class="logo"
      />

      <button id="ctrlToggle" class="ctrl-toggle" title="컨트롤 표시/숨기기">⏵</button>

      <div class="controls">
        <div class="button-row">
          <button id="prevBtn">◀</button>
          <button id="toggleBtn">❚❚ 정지</button>
          <button id="nextBtn">▶</button>
        </div>
        <div class="progress-bar-wrap">
          <div class="progress-bar" id="progressBar"></div>
        </div>
        <div class="timecode" id="timeDisplay">1 / 7</div>
      </div>
    </div>

    <script>
      const viewer       = document.getElementById('viewer');
      const modelNameBox = document.getElementById('modelName');
      const toggleBtn    = document.getElementById('toggleBtn');
      const prevBtn      = document.getElementById('prevBtn');
      const nextBtn      = document.getElementById('nextBtn');
      const progressBar  = document.getElementById('progressBar');
      const timeDisplay  = document.getElementById('timeDisplay');

      const modelList = [
        { name: "C형 스냅게이지", url: "https://disziplin1.github.io/TJT_/GAUGE_/C_SNAP_GAUGE/C_SNAP_GAUGE.glb" },
        { name: "장착거리 게이지", url: "https://disziplin1.github.io/TJT_/GAUGE_/Distance_Gauge/Distance_Gauge.glb" },
        { name: "홈경 스냅 게이지", url: "https://disziplin1.github.io/TJT_/GAUGE_/Groove_Snap_Gauge/Groove_Snap_Gauge.glb" },
        { name: "홈폭 스냅 게이지", url: "https://disziplin1.github.io/TJT_/GAUGE_/Groove_Width/Groove_Width.glb" },
        { name: "플러그 게이지", url: "https://disziplin1.github.io/TJT_/GAUGE_/Plug_Gauge/Plug_Gauge.glb" },
        { name: "일반 스냅게이지", url: "https://disziplin1.github.io/TJT_/GAUGE_/SNAP_GAUGE/SNAP_GAUGE.glb" },
        { name: "폭 게이지", url: "https://disziplin1.github.io/TJT_/GAUGE_/Width_Gauge/Width_Gauge.glb" }
      ];

      const DISPLAY_MS  = 8000;   // 모델 1개 표시 시간 (ms)
      let currentIndex  = 0;
      let isPlaying     = true;
      let startTime     = null;
      let rafId         = null;
      let loadGen       = 0;

      function cancelAll() {
        if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
      }

      function tick(ts) {
        if (!isPlaying || startTime === null) return;
        const elapsed = ts - startTime;
        const pct = Math.min(elapsed / DISPLAY_MS * 100, 100);
        progressBar.style.width = pct + '%';
        if (elapsed >= DISPLAY_MS) {
          currentIndex = (currentIndex + 1) % modelList.length;
          loadModel(currentIndex);
          return;
        }
        rafId = requestAnimationFrame(tick);
      }

      function loadModel(index) {
        cancelAll();
        const gen   = ++loadGen;
        const model = modelList[index];

        viewer.src               = model.url;
        modelNameBox.textContent = model.name;
        timeDisplay.textContent  = (index + 1) + ' / ' + modelList.length;
        progressBar.style.width  = '0%';

        viewer.addEventListener('load', () => {
          if (gen !== loadGen) return;
          startTime = null;
          rafId = requestAnimationFrame(ts => {
            startTime = ts;
            tick(ts);
          });
        }, { once: true });
      }

      toggleBtn.addEventListener('click', () => {
        if (isPlaying) {
          cancelAll();
          isPlaying = false;
          toggleBtn.textContent = '▶ 재생';
          viewer.autoRotate = false;
        } else {
          isPlaying = true;
          viewer.autoRotate = true;
          toggleBtn.textContent = '❚❚ 정지';
          startTime = null;
          rafId = requestAnimationFrame(ts => { startTime = ts; tick(ts); });
        }
      });

      prevBtn.addEventListener('click', () => {
        currentIndex = (currentIndex - 1 + modelList.length) % modelList.length;
        loadModel(currentIndex);
      });

      nextBtn.addEventListener('click', () => {
        currentIndex = (currentIndex + 1) % modelList.length;
        loadModel(currentIndex);
      });

      window.addEventListener('DOMContentLoaded', () => {
        loadModel(currentIndex);

        const ctrlToggle = document.getElementById('ctrlToggle');
        const controlsEl = document.querySelector('.controls');

        function setControls(show) {
          controlsEl.classList.toggle('show', show);
          ctrlToggle.classList.toggle('active', show);
          ctrlToggle.textContent = show ? '✕' : '⏵';
        }

        ctrlToggle.addEventListener('click', () => {
          setControls(!controlsEl.classList.contains('show'));
        });

        if (window.matchMedia('(hover: none) and (pointer: coarse)').matches) {
          setControls(true);
        }
      });
    </script>
  </body>
</html>
